name: TechFix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public Supabase project URL; safe to expose to the build.
      NEXT_PUBLIC_SUPABASE_URL: https://rkhkyyuxlcbcvpekuuty.supabase.co
      # Keep the service-role credential server-side and out of the repository.
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      TECHFIX_ADMIN_EMAIL: ci@example.com
      TECHFIX_ADMIN_PASSWORD: ci-placeholder
      TECHFIX_SESSION_SECRET: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
